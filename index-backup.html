<style>


*{
  -webkit-tap-highlight-color:transparent;
}

html,body{
  background:#000;
  font-family:'Inter',sans-serif;
  scroll-behavior:smooth;
}

h1,h2,h3,.font-display{
  font-family:'Manrope',sans-serif;
}

::-webkit-scrollbar{
  width:6px;
  height:6px;
}

::-webkit-scrollbar-track{
  background:#0a0a0a;
}

::-webkit-scrollbar-thumb{
  background:var(--pt-gold);
  border-radius:10px;
}

.gold-text{
  color:var(--pt-gold2);
}

.tab-underline{
  position:relative;
}

.tab-underline.active{
  color:var(--pt-gold2);
}

.tab-underline.active::after{
  content:'';
  position:absolute;
  left:8%;
  right:8%;
  bottom:-1px;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--pt-gold),transparent);
}

.fade-in{
  animation:fadeIn .18s ease-out;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}

.slide-up{
  animation:slideUp .22s cubic-bezier(.16,1,.3,1);
}

@keyframes slideUp{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}



.img-placeholder{
  background:repeating-linear-gradient(
    135deg,
    #0d0d0d,
    #0d0d0d 8px,
    #111 8px,
    #111 16px
  );
}

.hide-scrollbar::-webkit-scrollbar{
  display:none;
}

.hide-scrollbar{
  scrollbar-width:none;
}

.product-card{
  transition:.15s ease;
}

.product-card:active{
  transform:scale(.99);
}

/* POWERTECH · SISTEMA VISUAL UNIFICADO */
:root{--pt-bg:#030507;--pt-panel:#080f16;--pt-panel-2:#0c151d;--pt-line:rgba(255,255,255,.075);--pt-gold:#e6b83f;--pt-gold2:#ffc94f;--pt-text:#f4f6f8;--pt-muted:#8d98a3;--pt-green:#25d366}
html,body{background:var(--pt-bg)!important;color:var(--pt-text)!important}
</style>
